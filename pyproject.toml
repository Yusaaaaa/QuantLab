[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equity-quant-lab"
version = "0.1.0"
description = "Local, auditable US equity daily backtesting research lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<2.4", "pydantic>=2,<3",
  "PyYAML>=6,<7", "typer>=0.12,<1", "pyarrow>=15,<30",
  "exchange-calendars>=4.5,<5", "matplotlib>=3.8,<4", "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
online = ["yfinance>=0.2,<1"]

[project.scripts]
quantlab = "quantlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
quantlab = ["report/templates/*.j2"]
