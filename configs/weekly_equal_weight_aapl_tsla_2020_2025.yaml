# 2020-01-03 is a cash-only preparation close, not a trading date.
# Actual first purchase: Monday 2020-01-06 open. Last valuation: 2025-12-31 close.
backtest:
  start_date: "2020-01-03"
  end_date: "2025-12-31"
  initial_cash: 100000
  base_currency: USD
data:
  provider: parquet_local
  path: ../data/raw/yahoo_aapl_tsla_spy_20200103_20251231.parquet
  frequency: 1d
  price_mode: adjusted
  benchmark: SPY
  source: "Yahoo Finance via yfinance 0.2.66, actual historical AAPL/TSLA/SPY daily OHLCV; auto_adjust=False; actions=True; downloaded input frozen locally. January 3, 2020 is the cash preparation baseline."
universe:
  symbols: [AAPL, TSLA]
  source: fixed_list
strategy:
  path: ../strategies/weekly_equal_weight_aapl_tsla.py
  rebalance_schedule: daily
  params:
    start_date: "2020-01-06"
    end_date: "2025-12-31"
execution:
  decision_time: close
  timing: next_open
  allow_fractional_shares: false
commission:
  model: per_share
  per_share: 0.005
  minimum: 1.0
slippage:
  model: bps
  bps: 5.0
portfolio:
  allow_short: false
  allow_negative_cash: false
  max_position_weight: 1.0
  max_gross_exposure: 1.0
analytics:
  trading_days: 252
  risk_free_rate: 0.0
  rolling_window: 63
report:
  enabled: true
  open_after_run: false
  runs_dir: ../runs
reproducibility:
  random_seed: 42
