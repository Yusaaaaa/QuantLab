backtest:
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  initial_cash: 100000
data:
  provider: csv_local
  path: ../data/raw/sample.csv
  price_mode: adjusted
  benchmark: SPY
  source: "synthetic offline sample; not real market prices"
universe:
  symbols: [AAPL, TSLA]
  source: fixed_list
strategy:
  path: ../strategies/fixed_weight_buy_and_hold.py
  params:
    weights: {AAPL: 0.5, TSLA: 0.5}
  rebalance_schedule: daily
execution:
  decision_time: close
  timing: next_open
  allow_fractional_shares: false
commission:
  model: per_share
  per_share: 0.005
  minimum: 1.0
slippage:
  model: bps
  bps: 5.0
portfolio:
  allow_short: false
  allow_negative_cash: false
  max_position_weight: 1.0
  max_gross_exposure: 1.0
analytics:
  trading_days: 252
  risk_free_rate: 0.0
  rolling_window: 63
report:
  enabled: true
  open_after_run: false
  runs_dir: ../runs
reproducibility:
  random_seed: 42
